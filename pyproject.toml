[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speech-agent"
version = "0.1.0"
description = "An agent that reads a book aloud through a player tool it can pause, inspect and resume"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic[bedrock]>=0.40.0,<1.0",
    "en-core-web-sm",
    "huggingface-hub>=2.3.0",
    "kokoro>=0.9.4",
    "python-fasthtml>=0.12.0",
    "sherpa-onnx>=2.0.1",
]

[tool.pytest.ini_options]
testpaths = ["src/test"]
# live tests run Kokoro or call Bedrock; run them with -m live
addopts = "-m 'not live'"
markers = [
    "live: runs the real Kokoro model or calls Bedrock, seconds to minutes",
]

[tool.hatch.build.targets.wheel]
packages = ["src/main"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
